<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --navy:#0e2a47; --navy2:#0a2038; --paper:#f4ecd8; --ink:#16283d;
    --muted:#6b6250; --stamp:#b5372b; --customs:#2f6f4e; --gold:#b9922e; --line:#c9bfa2;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--navy);
    background-image:radial-gradient(120% 80% at 50% -10%, #163a5e 0%, var(--navy) 55%, var(--navy2) 100%);
    color:var(--paper);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100dvh; display:flex; flex-direction:column; align-items:center;
    padding:20px 16px calc(26px + env(safe-area-inset-bottom));
  }
  .wrap{width:100%; max-width:480px}

  /* Sprachumschalter */
  .langbar{display:flex; gap:6px; justify-content:flex-end; margin-bottom:12px; flex-wrap:wrap}
  .langbar button{
    font-family:"Space Mono",monospace; font-size:12px; font-weight:700; letter-spacing:.05em;
    color:var(--paper); background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2);
    border-radius:20px; padding:5px 10px; cursor:pointer;
  }
  .langbar button.active{background:var(--stamp); border-color:var(--stamp); color:#fff}

  .card{
    background:var(--paper);
    background-image:
      radial-gradient(120% 60% at 100% 0%, rgba(0,0,0,.04), transparent 60%),
      radial-gradient(100% 60% at 0% 100%, rgba(0,0,0,.05), transparent 55%);
    color:var(--ink); border-radius:12px;
    box-shadow:0 18px 40px rgba(0,0,0,.35), inset 0 0 0 1px rgba(0,0,0,.06);
    padding:22px 20px; position:relative; overflow:hidden;
  }
  .card::before{content:""; position:absolute; inset:8px; border:1.5px dashed var(--line); border-radius:8px; pointer-events:none}
  .inner{position:relative; z-index:1}
  .eyebrow{font-family:"Space Mono",monospace; font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:var(--stamp); font-weight:700; margin-bottom:10px}
  h1{font-family:"Oswald",sans-serif; font-weight:700; line-height:1; font-size:clamp(34px,10vw,48px); text-transform:uppercase; letter-spacing:.01em; color:var(--ink)}
  h1 .rot{color:var(--stamp)}
  .lead{margin-top:14px; font-size:15.5px; line-height:1.5; color:var(--ink)}
  .lead b{color:var(--stamp)}

  .stempel{display:inline-block; margin:20px 0 6px; transform:rotate(-5deg); border:3px solid var(--stamp); border-radius:8px; color:var(--stamp); padding:8px 16px 6px; text-align:center; box-shadow:0 0 0 3px rgba(181,55,43,.12)}
  .stempel .k{font-family:"Space Mono",monospace; font-size:10px; letter-spacing:.25em}
  .stempel .n{font-family:"Oswald",sans-serif; font-weight:700; font-size:40px; line-height:.9; margin:2px 0}

  .hr{height:1px; background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 12px); margin:20px 0}

  .btn{display:block; width:100%; text-align:center; cursor:pointer; font-family:"Oswald",sans-serif; text-transform:uppercase; letter-spacing:.06em; font-size:20px; font-weight:700; color:var(--paper); background:var(--stamp); border:none; border-radius:10px; padding:14px; box-shadow:0 4px 0 #7f271e; transition:transform .05s, box-shadow .05s}
  .btn:active{transform:translateY(3px); box-shadow:0 1px 0 #7f271e}
  .btn:disabled{opacity:.6; box-shadow:0 4px 0 #7f271e; cursor:wait}
  .btn.gruen{background:var(--customs); box-shadow:0 4px 0 #1f4d36}
  .btn.gruen:active{box-shadow:0 1px 0 #1f4d36}
  .ghost{display:block; width:100%; text-align:center; margin-top:12px; cursor:pointer; background:none; border:none; color:var(--muted); font-size:13px; text-decoration:underline; text-underline-offset:3px; font-family:inherit}

  label{display:block; font-family:"Space Mono",monospace; font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:0 0 6px 2px}
  label .opt{font-weight:400; text-transform:none; letter-spacing:0}
  input[type=text]{width:100%; font-size:16px; font-family:inherit; color:var(--ink); background:#fffdf7; border:1.5px solid var(--line); border-radius:9px; padding:12px; outline:none}
  input[type=text]:focus{border-color:var(--stamp); box-shadow:0 0 0 3px rgba(181,55,43,.15)}
  .feld{margin-bottom:16px}

  .ortbox{background:#fffdf7; border:1.5px solid var(--line); border-radius:9px; padding:12px; display:flex; align-items:center; gap:10px}
  .ortbox .pin{font-size:20px}
  .ortbox .txt{flex:1; font-size:14px; color:var(--ink)}
  .ortbox .txt small{display:block; color:var(--muted); font-family:"Space Mono",monospace; font-size:11px}
  .ortbox button{flex-shrink:0; font-family:"Space Mono",monospace; font-size:12px; font-weight:700; background:var(--navy); color:var(--paper); border:none; border-radius:7px; padding:9px 11px; cursor:pointer}
  .ortbox button:active{opacity:.8}

  textarea{width:100%; font-size:16px; font-family:inherit; color:var(--ink); background:#fffdf7; border:1.5px solid var(--line); border-radius:9px; padding:12px; outline:none; resize:vertical; min-height:60px}
  textarea:focus{border-color:var(--customs); box-shadow:0 0 0 3px rgba(47,111,78,.15)}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
  .chip{font-family:"Space Mono",monospace; font-size:12px; color:var(--customs); background:#eef4ee; border:1px solid var(--customs); border-radius:20px; padding:5px 10px; cursor:pointer}
  .chip:active{background:var(--customs); color:#fff}
  .chips .k{width:100%; font-size:11px; color:var(--muted); font-family:"Space Mono",monospace; letter-spacing:.08em}
  .regeln{font-size:11.5px; line-height:1.4; color:var(--muted); margin-top:9px}

  .check{display:flex; gap:10px; align-items:flex-start; margin-top:4px; cursor:pointer}
  .check input{width:20px; height:20px; margin-top:1px; accent-color:var(--stamp); flex-shrink:0}
  .check span{font-size:13.5px; line-height:1.4; color:var(--ink)}
  .fotobtn{width:100%; font-size:15px; font-weight:700; font-family:inherit; background:#fffdf7; border:2px dashed var(--line); border-radius:9px; padding:12px; cursor:pointer; color:var(--ink)}
  .fotobtn:active{background:#eef4ee}
  .fotovorschau{display:none; align-items:center; gap:10px; margin-top:8px; border:1.5px solid var(--line); border-radius:9px; padding:8px; background:#fffdf7}
  .fotovorschau img{width:56px; height:56px; object-fit:cover; border-radius:6px; border:1px solid var(--line)}
  .fotovorschau button{margin-left:auto; font-family:inherit; font-weight:700; background:none; border:1.5px solid var(--line); border-radius:7px; padding:6px 10px; cursor:pointer}
  .privat{display:none; margin-top:14px; padding-top:14px; border-top:1px dashed var(--line)}
  .hinweis{font-size:12px; color:var(--muted); line-height:1.45; margin-top:10px}
  .fehler{display:none; margin-top:12px; font-size:14px; font-weight:600; color:var(--stamp); text-align:center}

  #map{height:300px; border-radius:10px; border:1.5px solid var(--line); margin:4px 0 16px; z-index:0}
  .leaflet-container{background:#e9e2cd; font-family:inherit}
  .stationicon{width:26px; height:26px; border-radius:50%; background:var(--stamp); color:#fff; border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; font-family:"Oswald",sans-serif; font-weight:700; font-size:13px}
  .stationicon.start{background:var(--customs)}

  .stat{font-family:"Oswald",sans-serif; text-transform:uppercase; font-size:14px; letter-spacing:.1em; color:var(--muted); margin:2px 2px 8px}
  .stat b{color:var(--stamp)}
  .timeline{list-style:none; margin-top:4px}
  .timeline li{display:flex; gap:12px; padding:10px 0; border-bottom:1px dashed var(--line)}
  .timeline li:last-child{border-bottom:none}
  .tl-nr{flex-shrink:0; width:34px; height:34px; border:2px solid var(--stamp); color:var(--stamp); border-radius:6px; display:flex; align-items:center; justify-content:center; font-family:"Oswald",sans-serif; font-weight:700; font-size:16px; transform:rotate(-4deg)}
  .tl-txt b{font-size:15px; color:var(--ink)}
  .tl-txt small{display:block; font-family:"Space Mono",monospace; font-size:11px; color:var(--muted); margin-top:2px}
  .tl-tipp{display:block; margin-top:7px; font-size:13.5px; line-height:1.4; color:var(--ink); background:#eef4ee; border-left:3px solid var(--customs); border-radius:0 7px 7px 0; padding:7px 10px}
  .tl-tipp::before{content:"💬 "}

  .weitergeben{margin-top:18px; background:var(--navy); color:var(--paper); border-radius:10px; padding:16px}
  .weitergeben .t{font-family:"Oswald",sans-serif; text-transform:uppercase; font-size:18px; letter-spacing:.04em; color:var(--gold)}
  .weitergeben p{font-size:14px; line-height:1.5; margin-top:8px; color:#e7e0cd}
  .weitergeben p b{color:#fff}
  .weitergeben .insta{margin-top:12px;padding-top:10px;border-top:1px dashed rgba(255,255,255,.18);font-size:13.5px;line-height:1.45;color:#e7e0cd}
  .weitergeben .insta a{color:var(--gold);font-weight:700;text-decoration:none}

  .demo{display:none; text-align:center; font-family:"Space Mono",monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); border:1px dashed var(--gold); border-radius:8px; padding:8px; margin-bottom:16px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="langbar" id="langbar"></div>
  <div class="demo" id="demo">Demo</div>

  <div class="card"><div class="inner">

    <section id="view-start">
      <div class="eyebrow" id="t_eyebrow"></div>
      <h1 id="t_h1"></h1>
      <div class="stempel"><div class="k" id="t_stempelLabel"></div><div class="n" id="startNr">–</div></div>
      <p class="lead" id="t_lead"></p>
      <div class="hr"></div>
      <button class="btn" id="btnMitmachen"></button>
      <button class="ghost" id="btnNurSchauen"></button>
    </section>

    <section id="view-form" style="display:none">
      <div class="eyebrow" id="t_eyebrowForm"></div>
      <h1 id="t_h1Form" style="font-size:clamp(28px,8vw,38px)"></h1>
      <p class="lead" id="t_leadForm" style="margin-bottom:18px"></p>

      <div class="feld">
        <label id="t_labelOrt"></label>
        <div class="ortbox">
          <span class="pin" id="ortPin">📡</span>
          <div class="txt" id="ortText"><span id="ortMain"></span><small id="ortSub"></small></div>
          <button type="button" id="btnGPS"></button>
        </div>
      </div>

      <div class="feld">
        <label id="t_labelTipp"></label>
        <textarea id="fTipp" maxlength="200" rows="2"></textarea>
        <div class="chips" id="naheChips"></div>
        <p class="regeln" id="t_regeln"></p>
      </div>

      <label class="check"><input type="checkbox" id="chkVerraten"><span id="t_check"></span></label>

      <div class="privat" id="privatFelder">
        <div class="feld"><label id="t_labelName"></label><input type="text" id="fName" autocomplete="off"></div>
        <div class="feld"><label id="t_labelSocials"></label><input type="text" id="fSocial" placeholder="@instagram, TikTok …" autocomplete="off"></div>
        <div class="feld" style="margin-bottom:12px">
          <label id="t_labelFoto"></label>
          <input type="file" id="fotoInput" accept="image/*" style="display:none">
          <button type="button" class="fotobtn" id="fotoBtn"></button>
          <div class="fotovorschau" id="fotoVorschau"><img id="fotoBild" alt=""><button type="button" id="fotoEntfernen">✕</button></div>
        </div>
        <label class="check"><input type="checkbox" id="chkInsta"><span id="t_consentInsta"></span></label>
      </div>

      <div class="hr"></div>
      <button class="btn gruen" id="btnEintragen"></button>
      <button class="ghost" id="btnZurueck"></button>
      <div class="fehler" id="formFehler"></div>
      <p class="hinweis" id="t_hinweis"></p>
    </section>

    <section id="view-journey" style="display:none">
      <div class="eyebrow" id="t_eyebrowReise"></div>
      <div class="stat" id="reiseStat"></div>
      <div id="map"></div>
      <ul class="timeline" id="timeline"></ul>
      <div class="weitergeben">
        <div class="t" id="t_weiterTitle"></div>
        <p id="t_weiterText"></p>
        <p class="insta" id="t_insta"></p>
      </div>
      <button class="ghost" id="btnReload" style="margin-top:16px"></button>
    </section>

  </div></div>
</div>

/* ================= STATE ================= */
const CARD = (new URLSearchParams(location.search).get("c") || "default").replace(/[^a-zA-Z0-9_-]/g,"").slice(0,40) || "default";
const DEMO = !CONFIG.BACKEND_URL;
const $ = id => document.getElementById(id);
const escHtml = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let meinOrt=null, mapObj=null, lastHops=null, currentView="start", lastNahe=[], fotoDatei=null;

let LANG = localStorage.getItem("wk_lang");
if(!LANG || !i18n[LANG]){ const n=(navigator.language||"de").slice(0,2).toLowerCase(); LANG = i18n[n]?n:"de"; }
let T = i18n[LANG];

/* ================= SPRACHE ANWENDEN ================= */
function buildLangBar(){
  const bar=$("langbar"); bar.innerHTML="";
  Object.keys(i18n).forEach(code=>{
    const b=document.createElement("button");
    b.textContent=i18n[code]._name;
    if(code===LANG) b.classList.add("active");
    b.addEventListener("click",()=>setLang(code));
    bar.appendChild(b);
  });
}
function setLang(code){
  if(!i18n[code]) return;
  LANG=code; T=i18n[code];
  try{ localStorage.setItem("wk_lang",code); }catch{}
  buildLangBar(); applyLang();
}
function applyLang(){
  document.documentElement.lang=LANG;
  $("t_eyebrow").textContent=T.eyebrow;
  $("t_h1").innerHTML=`${T.h1a}<br><span class="rot">${T.h1b}</span>`;
  $("t_stempelLabel").textContent=T.stempelLabel;
  $("t_lead").innerHTML=T.lead;
  $("btnMitmachen").textContent=T.btnMitmachen;
  $("btnNurSchauen").textContent=T.btnNurSchauen;
  $("t_eyebrowForm").textContent=T.eyebrowForm;
  $("t_h1Form").innerHTML=T.h1Form;
  $("t_leadForm").innerHTML=T.leadForm;
  $("t_labelOrt").textContent=T.labelOrt;
  if(!meinOrt) $("ortSub").textContent=T.ortSub;
  $("btnGPS").textContent=T.btnGPS;
  $("t_labelTipp").innerHTML=`${T.labelTipp} <span class="opt">${T.tippOpt}</span>`;
  $("fTipp").placeholder=T.tippPlaceholder;
  $("t_check").innerHTML=T.check;
  $("t_labelName").textContent=T.labelName;
  $("fName").placeholder=T.namePlaceholder;
  $("t_labelSocials").innerHTML=`${T.labelSocials} <span class="opt">${T.socialsOpt}</span>`;
  $("t_labelFoto").textContent=T.labelFoto;
  $("fotoBtn").textContent=T.fotoAdd;
  $("t_consentInsta").textContent=T.consentInsta;
  $("t_regeln").textContent=T.regeln;
  $("btnEintragen").textContent=T.btnEintragen;
  $("btnZurueck").textContent=T.btnZurueck;
  $("t_hinweis").textContent=T.hinweis;
  $("t_eyebrowReise").textContent=T.eyebrowReise;
  $("t_weiterTitle").textContent=T.weiterTitle;
  $("t_weiterText").innerHTML=T.weiterText;
  $("t_insta").innerHTML=T.insta;
  $("btnReload").textContent=T.btnReload;
  if(meinOrt!==null || currentView==="form") zeigeOrt();
  renderChips();
  if(currentView==="journey" && lastHops) zeigeReise(lastHops);
}

/* ================= BACKEND ================= */
async function ladeReise(){
  if(DEMO){ try{ return JSON.parse(localStorage.getItem("wk_"+CARD)||"[]"); }catch{ return []; } }
  const r=await fetch(`${CONFIG.BACKEND_URL}/journey?c=${CARD}`);
  if(!r.ok) throw new Error("GET "+r.status);
  return (await r.json()).hops||[];
}
const GRID=0.001, raster=x=>Number((Math.round(x/GRID)*GRID).toFixed(5));
async function trageEin(ort,tipp){
  tipp=(tipp||"").trim().slice(0,200);
  if(DEMO){
    const hops=await ladeReise();
    hops.push({lat:raster(ort.lat),lon:raster(ort.lon),city:ort.city,country:ort.country,tip:tipp,ts:Date.now()});
    localStorage.setItem("wk_"+CARD,JSON.stringify(hops)); return hops;
  }
  const r=await fetch(`${CONFIG.BACKEND_URL}/journey?c=${CARD}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...ort,tip:tipp})});
  if(!r.ok){ if(r.status===429) throw new Error(T.errCooldown); throw new Error("POST "+r.status); }
  return (await r.json()).hops||[];
}

/* ================= STANDORT ================= */
async function ipGeo(){
  try{ const r=await fetch("https://ipwho.is/"); const d=await r.json(); if(d&&d.success&&isFinite(d.latitude)) return {lat:d.latitude,lon:d.longitude,city:d.city||"",country:d.country||""}; }catch{}
  try{ const r=await fetch("https://ipapi.co/json/"); const d=await r.json(); if(d&&isFinite(d.latitude)) return {lat:d.latitude,lon:d.longitude,city:d.city||"",country:d.country_name||""}; }catch{}
  return null;
}
function gpsPos(){ return new Promise((res,rej)=>{ if(!navigator.geolocation) return rej(); navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lon:p.coords.longitude}),()=>rej(),{enableHighAccuracy:false,timeout:9000}); }); }
async function reverseGeo(lat,lon){
  try{ const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=10&lat=${lat}&lon=${lon}`,{headers:{"Accept":"application/json"}}); const a=(await r.json()).address||{}; return {city:a.city||a.town||a.village||a.county||"",country:a.country||""}; }catch{ return null; }
}
function zeigeOrt(){
  if(!meinOrt){ $("ortMain").textContent=T.ortNichtGefunden; $("ortSub").textContent=T.ortNichtGefundenSub; $("ortPin").textContent="❓"; return; }
  const label=[meinOrt.city,meinOrt.country].filter(Boolean).join(", ")||T.unbekannterOrt;
  $("ortPin").textContent="📍"; $("ortMain").textContent=label; $("ortSub").textContent=`${meinOrt.lat.toFixed(2)}, ${meinOrt.lon.toFixed(2)}`;
}

/* ================= NÄHE-VORSCHLÄGE ================= */
function meterDist(aLat,aLon,bLat,bLon){ const R=6371000,dLa=(bLat-aLat)*Math.PI/180,dLo=(bLon-aLon)*Math.PI/180,la1=aLat*Math.PI/180,la2=bLat*Math.PI/180; const h=Math.sin(dLa/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function renderChips(){
  const box=$("naheChips"); box.innerHTML="";
  if(!lastNahe.length) return;
  box.innerHTML=`<div class="k">${T.chipsHelper}</div>`;
  lastNahe.forEach(n=>{
    const c=document.createElement("button"); c.type="button"; c.className="chip"; c.textContent=n;
    c.addEventListener("click",()=>{ const f=$("fTipp"); f.value=f.value.trim()?f.value.replace(/\s*$/,"")+" — "+n:n+T.chipFill; f.focus(); });
    box.appendChild(c);
  });
}
async function naheOrteLaden(ort){
  lastNahe=[]; renderChips();
  if(!ort||!isFinite(ort.lat)) return;
  const q="[out:json][timeout:15];("+`node(around:350,${ort.lat},${ort.lon})[amenity~"^(restaurant|cafe|bar|fast_food|pub|ice_cream|bakery)$"][name];`+`node(around:350,${ort.lat},${ort.lon})[shop][name];`+");out body 40;";
  const ep=["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"];
  let els=null;
  for(const u of ep){ try{ const r=await fetch(u,{method:"POST",body:"data="+encodeURIComponent(q)}); if(!r.ok) continue; els=(await r.json()).elements||[]; break; }catch{} }
  if(!els||!els.length) return;
  els.forEach(e=> e._d=meterDist(ort.lat,ort.lon,e.lat,e.lon)); els.sort((a,b)=>a._d-b._d);
  lastNahe=[...new Set(els.map(e=>e.tags.name))].slice(0,4);
  renderChips();
}

/* ================= ntfy ================= */
async function pushAnBesitzer(name,social,ort,consent){
  const zeilen=["🗺️ Neue Station auf der Kartenreise!","",name?"👤 Name: "+name:"👤 (kein Name)",social?"📱 Socials: "+social:null,"📍 Ort: "+([ort.city,ort.country].filter(Boolean).join(", ")||"unbekannt"),consent?"📸 Insta-Freigabe: JA ✅":"📸 Insta-Freigabe: nein"].filter(z=>z!==null);
  const url=`${CONFIG.NTFY_SERVER}/${CONFIG.NTFY_TOPIC}`;
  try{ await fetch(url,{method:"POST",body:zeilen.join("\n"),headers:{"X-Title":"Kartenreise","X-Tags":"round_pushpin"}}); }catch{}
  if(fotoDatei){ try{ const blob=await fotoKomprimieren(fotoDatei); await fetch(url,{method:"PUT",body:blob,headers:{"X-Filename":"foto.jpg","X-Title":consent?"Foto (Insta-Freigabe JA)":"Foto (keine Insta-Freigabe)","X-Tags":"camera_with_flash"}}); }catch{} }
}

/* ================= REISE ZEICHNEN ================= */
function zeigeReise(hops){
  wechsel("journey");
  hops=(hops||[]).slice().sort((a,b)=>a.ts-b.ts); lastHops=hops;
  const word=hops.length===1?T.stSing:T.stPlur;
  $("reiseStat").innerHTML=hops.length?`<b>${hops.length}</b> ${word} ${T.statSuffix}`:T.statEmpty;

  if(!mapObj){
    mapObj=L.map("map",{scrollWheelZoom:false}).setView(CONFIG.MAP_START,CONFIG.MAP_ZOOM);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",{subdomains:"abcd",maxZoom:19,attribution:"© OpenStreetMap · © CARTO"}).addTo(mapObj);
  }
  mapObj.eachLayer(l=>{ if(l instanceof L.Marker||l instanceof L.Polyline) mapObj.removeLayer(l); });
  const pts=hops.map(h=>[h.lat,h.lon]);
  if(pts.length>1) L.polyline(pts,{color:"#b5372b",weight:2.5,opacity:.85,dashArray:"1 7",lineCap:"round"}).addTo(mapObj);
  hops.forEach((h,i)=>{
    const icon=L.divIcon({className:"",html:`<div class="stationicon ${i===0?"start":""}">${i+1}</div>`,iconSize:[26,26],iconAnchor:[13,13]});
    const wann=new Date(h.ts).toLocaleDateString(T.locale);
    const wo=[h.city,h.country].filter(Boolean).join(", ")||T.unbekannterOrt;
    const tippTxt=h.tip?`<br><i>💬 ${escHtml(h.tip)}</i>`:"";
    L.marker([h.lat,h.lon],{icon}).addTo(mapObj).bindPopup(`<b>${T.popupStation} ${i+1}</b><br>${wo}<br>${wann}${tippTxt}`);
  });
  if(pts.length===1) mapObj.setView(pts[0],11); else if(pts.length>1) mapObj.fitBounds(pts,{padding:[40,40]});

  const tl=$("timeline"); tl.innerHTML="";
  hops.slice().reverse().forEach((h,ri)=>{
    const nr=hops.length-ri;
    const wann=new Date(h.ts).toLocaleDateString(T.locale,{day:"2-digit",month:"long",year:"numeric"});
    const wo=[h.city,h.country].filter(Boolean).join(", ")||T.unbekannterOrt;
    const tippTxt=h.tip?`<span class="tl-tipp">${escHtml(h.tip)}</span>`:"";
    const li=document.createElement("li");
    li.innerHTML=`<div class="tl-nr">${nr}</div><div class="tl-txt"><b>${wo}</b><small>${wann}</small>${tippTxt}</div>`;
    tl.appendChild(li);
  });
  setTimeout(()=>mapObj.invalidateSize(),60);
}

/* ================= ANSICHTEN ================= */
function wechsel(v){ currentView=v; ["start","form","journey"].forEach(x=>$("view-"+x).style.display=(x===v?"block":"none")); window.scrollTo({top:0}); }

$("chkVerraten").addEventListener("change",e=>{ $("privatFelder").style.display=e.target.checked?"block":"none"; });
$("fotoBtn").addEventListener("click",()=>$("fotoInput").click());
$("fotoInput").addEventListener("change",()=>{const f=$("fotoInput").files[0];if(!f)return;fotoDatei=f;$("fotoBild").src=URL.createObjectURL(f);$("fotoBtn").style.display="none";$("fotoVorschau").style.display="flex";});
$("fotoEntfernen").addEventListener("click",()=>{fotoDatei=null;$("fotoInput").value="";$("fotoVorschau").style.display="none";$("fotoBtn").style.display="block";});
function fotoKomprimieren(datei){return new Promise((res,rej)=>{const u=URL.createObjectURL(datei);const img=new Image();img.onload=()=>{const max=1280;let w=img.width,h=img.height;if(Math.max(w,h)>max){const f=max/Math.max(w,h);w=Math.round(w*f);h=Math.round(h*f);}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error("compress")),"image/jpeg",0.8);};img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("img"));};img.src=u;});}
$("btnGPS").addEventListener("click",async()=>{
  $("btnGPS").textContent="…";
  try{ const g=await gpsPos(); const label=await reverseGeo(g.lat,g.lon); meinOrt={lat:g.lat,lon:g.lon,city:(label&&label.city)||(meinOrt&&meinOrt.city)||"",country:(label&&label.country)||(meinOrt&&meinOrt.country)||""}; }catch{}
  $("btnGPS").textContent=T.btnGPS; zeigeOrt(); naheOrteLaden(meinOrt);
});
$("btnMitmachen").addEventListener("click",async()=>{ wechsel("form"); $("ortMain").textContent=T.ortErmittelt; $("ortSub").textContent=T.ortSub; meinOrt=await ipGeo(); zeigeOrt(); naheOrteLaden(meinOrt); });
$("btnZurueck").addEventListener("click",()=>wechsel("start"));
$("btnNurSchauen").addEventListener("click",async()=>{ try{ zeigeReise(await ladeReise()); }catch(e){ alert(T.ladeFehler+" ("+e.message+")"); } });
$("btnReload").addEventListener("click",async()=>{ try{ zeigeReise(await ladeReise()); }catch{} });
$("btnEintragen").addEventListener("click",async()=>{
  const fehler=$("formFehler"); fehler.style.display="none";
  if(!meinOrt||!isFinite(meinOrt.lat)){ fehler.textContent=T.errNoOrt; fehler.style.display="block"; return; }
  const btn=$("btnEintragen"); btn.disabled=true; btn.textContent=T.btnEintragenBusy;
  try{
    const hops=await trageEin(meinOrt,$("fTipp").value);
    if($("chkVerraten").checked) await pushAnBesitzer($("fName").value.trim(),$("fSocial").value.trim(),meinOrt,$("chkInsta").checked);
    try{ localStorage.setItem("wk_done_"+CARD,"1"); }catch{}
    zeigeReise(hops);
  }catch(e){ btn.disabled=false; btn.textContent=T.btnEintragen; fehler.textContent=T.errFail+e.message; fehler.style.display="block"; }
});

/* ================= START ================= */
buildLangBar(); applyLang();
(async function init(){
  if(DEMO) $("demo").style.display="block";
  let hops=[]; try{ hops=await ladeReise(); }catch{ hops=[]; }
  $("startNr").textContent=hops.length+1;
  let done=false; try{ done=!!localStorage.getItem("wk_done_"+CARD); }catch{}
  if(done) zeigeReise(hops);
})();
</script>
